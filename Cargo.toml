[package]
name = "stb_image_nrp"
description = "Image file readers in pure, safe Rust: a native port of stb_image.h (PNG, BMP, JPEG, GIF, TGA, PSD, PNM, HDR, PIC), bit-identical to it."
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Unlicense"
repository = "https://github.com/OctoKeights/stb_image_nrp"
readme = "README.md"
keywords = ["png", "jpeg", "image", "decoder", "stb"]
categories = ["multimedia::images", "encoding", "no-std"]
exclude = [".github/", "compare/", "clippy.toml", "rust-toolchain.toml"]

[features]
default = ["std"]
std = []
fast-zlib = ["dep:libdeflate_nrp"]

[dependencies]
libdeflate_nrp = { version = "0.3.0", optional = true, default-features = false }

[dev-dependencies]
miniz_nrp = "0.3.0"
stb_image_write_nrp = "0.3.0"

[profile.test]
opt-level = 2

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Flags clear pairs of names such as max_ac and max_dc, or runs and rune.
similar_names = "allow"
